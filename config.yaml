# ===== 每日新聞 × 單字學習 設定檔 =====

news_count: 5          # 每日新聞數量
lookback_hours: 24     # 只取過去幾小時內的新聞
timezone_offset: 8     # 台灣 UTC+8（用來決定檔名日期）

# 新增 / 移除來源：直接增減下面的項目即可（排在前面的優先度較高）
feeds:
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: The Guardian World
    url: https://www.theguardian.com/world/rss
  - name: NPR News
    url: https://feeds.npr.org/1001/rss.xml
  - name: Reuters (Google News)
    url: "https://news.google.com/rss/search?q=when:24h+site:reuters.com&ceid=US:en&hl=en-US&gl=US"

# 合計不足 news_count 則時的補充來源
fallback_feed:
  name: Google News
  url: "https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en"

gemini:
  model: gemini-3.8-flash
  fallback_models: []  # 主模型失敗時依序嘗試     # 免費額度的 Flash 系列模型，可自行更換
  retry_wait_seconds: 60      # 遇到 429 等待秒數
  max_retries: 3              # 429 最多重試次數

learner:
  level: "多益 500–600 分（約 CEFR A2–B1）"
  words_per_news: "3–5"

# 網站（GitHub Pages，來源設為 main 分支的 /docs 資料夾）
site_url: https://qsceszwdvrdx.github.io/en_news/

# 英文語音（edge-tts，免費、不需 API Key）
tts:
  enabled: true
  voice: en-US-AriaNeural      # 英式可改 en-GB-SoniaNeural；男聲如 en-US-GuyNeural
  summary_rate: "-10%"         # 摘要朗讀速度（負值較慢，適合練聽力）
  concurrency: 4

# 過期檔案檢查（check_stale.py）
stale:
  days: 7              # 檔名日期早於「今天 - 7 天」視為過期
  delete_audio: true   # 自動刪除過期的 docs/audio/日期/ 語音；其他檔案只列報告
