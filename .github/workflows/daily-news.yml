name: Daily News

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 台灣時間 07:00
  workflow_dispatch:        # 可手動觸發

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Check stale files (older than 7 days)
        if: always()
        run: python check_stale.py

      - name: Commit and push
        if: always()   # 即使產生失敗也要把 logs 存起來
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news news_en anki README.md logs docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily news $(TZ=Asia/Taipei date +%F)"
            git push
          fi
